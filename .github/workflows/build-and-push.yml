name: Build and Push Docker Image

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update image tag in GitOps repo
      if: github.ref == 'refs/heads/main'
      run: |
        # Clone le repo GitOps
        git clone https://github.com/${{ github.repository_owner }}/arcc-website-gitops.git gitops-repo
        cd gitops-repo
        
        # Configurer Git
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Mettre à jour le tag d'image
        NEW_TAG="${{ github.ref_name }}-$(date +%Y%m%d%H%M%S)"
        sed -i "s/main-latest/$NEW_TAG/g" clusters/production/arcc-website-kustomization.yaml
        
        # Commit et push
        git add .
        git commit -m "Update image tag to $NEW_TAG"
        git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/arcc-website-gitops.git main
