version: '3.8'

services:
  # Service de développement
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3020:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    networks:
      - default
      - nginx-proxy-manager_default
    profiles:
      - dev

  # Service de production
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    networks:
      - default
      - nginx-proxy-manager_default
    profiles:
      - prod

  # Service de build uniquement (pour tester la construction)
  app-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./out:/app/out
    command: ["npm", "run", "build"]
    profiles:
      - build

# Réseaux
networks:
  default:
    name: arcc-website-network
  nginx-proxy-manager_default:
    external: true
