apiVersion: v1
kind: ServiceMonitor
metadata:
  name: arcc-website
  namespace: arcc-website
  labels:
    app: arcc-website
spec:
  selector:
    matchLabels:
      app: arcc-website
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: arcc-website-alerts
  namespace: arcc-website
spec:
  groups:
  - name: arcc-website.rules
    rules:
    - alert: ArccWebsiteDown
      expr: up{job="arcc-website-service"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "ARCC Website is down"
        description: "ARCC Website has been down for more than 1 minute."
    
    - alert: ArccWebsiteHighMemory
      expr: container_memory_usage_bytes{pod=~"arcc-website-.*"} / container_spec_memory_limit_bytes > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "ARCC Website high memory usage"
        description: "ARCC Website memory usage is above 80% for more than 5 minutes."
