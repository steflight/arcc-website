apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcc-website
  namespace: arcc-website
  labels:
    app: arcc-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arcc-website
  template:
    metadata:
      labels:
        app: arcc-website
    spec:
      containers:
      - name: arcc-website
        image: arcc-website:latest
        imagePullPolicy: Never  # Pour utiliser l'image locale
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      restartPolicy: Always
